name: Build and deploy to Danube Data static site
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Set up Node.js
        uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install DanubeData CLI
        run: npm install -g @danubedata/cli
      - name: Deploy to Danube Data
        run: danube pages deploy --dir ./dist
        env:
          DANUBE_TOKEN: ${{ secrets.DANUBEDATA_API_TOKEN }}
          DANUBE_SITE_ID: ${{ secrets.DANUBEDATA_SITE_ID }}
          DANUBE_TEAM_ID: ${{ secrets.DANUBEDATA_TEAM_ID }}

name: Build and deploy to Danube Data static site
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Zip dist
        run: cd dist && zip -r ../dist.zip . && cd ..
      - name: Deploy to Danube Data
        run: |
          curl --fail-with-body -X POST \
            "https://danubedata.ro/api/v1/static-sites/${{ secrets.DANUBEDATA_SITE_ID }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.DANUBEDATA_API_TOKEN }}" \
            -H "X-Team-Id: ${{ secrets.DANUBEDATA_TEAM_ID }}" \
            -F "file=@./dist.zip"
